name: Release

# release-please keeps a release PR open on main. Merging it tags the release,
# and the jobs below pack, smoke-test and publish that tag.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # GitHub starts no workflow runs for a pull request opened with GITHUB_TOKEN,
      # so a release PR opened with it would never get CI checks.
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  verify:
    name: Verify and pack
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      - name: Verify tag matches package.json version
        env:
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          version="$(npm pkg get version | tr -d '"')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run codegen:check
      - run: npm audit --omit=dev --audit-level=low

      # The only build: prepack runs `build` and `check:bundle`, and this tarball is
      # the exact artifact the publish job uploads to npm.
      - name: Pack
        id: pack
        run: |
          mkdir -p "$RUNNER_TEMP/package"
          npm pack --pack-destination "$RUNNER_TEMP/package"
          cd "$RUNNER_TEMP/package"
          tarball="$(ls -- *.tgz)"
          sha256sum "$tarball" > "$tarball.sha256"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/package/
          if-no-files-found: error
          retention-days: 30

  smoke:
    name: Smoke test (Node ${{ matrix.node-version }})
    needs: [release-please, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        node-version: ['22.13.0', '24.x', '26.x']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          persist-credentials: false
          sparse-checkout: scripts/smoke-test-tarball.sh
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/package

      - name: Verify checksum
        working-directory: ${{ runner.temp }}/package
        run: sha256sum --check --strict -- *.sha256

      - name: Smoke test the packed tarball
        env:
          TARBALL: ${{ runner.temp }}/package/${{ needs.verify.outputs.tarball }}
        run: bash scripts/smoke-test-tarball.sh "$TARBALL"

  publish:
    name: Publish to npm
    needs: [release-please, verify, smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x

      # Trusted publishing (OIDC) needs npm 11.5.1 or later.
      - run: npm install -g npm@11.21.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: ${{ runner.temp }}/package

      - name: Verify checksum
        working-directory: ${{ runner.temp }}/package
        run: sha256sum --check --strict -- *.sha256

      # Publishing a tarball runs no lifecycle scripts and rebuilds nothing, so npm
      # receives the bytes that were smoke-tested.
      - name: Publish
        working-directory: ${{ runner.temp }}/package
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
          TARBALL: ${{ needs.verify.outputs.tarball }}
        run: |
          case "$VERSION" in
            *-*) npm publish "./$TARBALL" --provenance --access public --tag next ;;
            *) npm publish "./$TARBALL" --provenance --access public ;;
          esac
