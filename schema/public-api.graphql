type WhoAmIResponse {
  """
  Access level per kind of resource in `teamId`. All `none` when no team is settled.
  """
  access: [ResolvedAccess!]!

  """Whether the token authenticated. Always true in a response."""
  authenticated: Boolean!

  """Whether the token has admin rights in `teamId`."""
  isAdmin: Boolean!

  """
  `personal` for a token that acts as its user, or `team` for a team token.
  """
  kind: String!

  """
  The team this call acts in, when one is settled: the token covers exactly one team, or the request named one. Null for a personal token that covers several teams and named none.
  """
  teamId: String

  """Every team the token may act in."""
  teamIds: [String!]!

  """Name given to the token when it was created."""
  tokenName: String!
}