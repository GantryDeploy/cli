type Mutation {
  abortCanary(input: ActivationInput!, team: String): ActivationResult!

  """
  Move a database's objects to Gantry's owner role so service users can be granted access. Each previous owner becomes a member of the owner role, so existing users keep working with owner rights over the whole database. Returns a deploymentId to poll.
  """
  adoptDatabase(
    """Database inside the server"""
    database: String!

    """Database server id"""
    id: String!
    team: String
  ): DatabaseMutationResult!
  cancelDeployment(id: String!, team: String): CancelDeploymentResult!
  claimStep(stepId: String!, team: String): ClaimStepResult!
  completeCliStep(fileResults: [FileUploadResultInput!], outputs: CliTaskOutputsInput!, stepId: String!, team: String): CompleteCliStepResult!
  createBastion(input: CreateBastionInput!, team: String): BastionMutationResult!
  createCache(input: CreateCacheInput!, team: String): CacheMutationResult!
  createCertificate(input: CreateCertificateInput!, team: String): CertificateMutationResult!
  createCluster(input: CreateClusterInput!, team: String): ClusterMutationResult!
  createDatabase(input: CreateDatabaseInput!, team: String): DatabaseMutationResult!
  createDomain(input: CreateDomainInput!, team: String): DomainMutationResult!
  createEnvironment(input: CreateEnvironmentInput!, team: String): EnvironmentMutationResult!
  createFilesystem(input: CreateFilesystemInput!, team: String): FilesystemMutationResult!
  createLoadBalancer(input: CreateLoadBalancerInput!, team: String): LoadBalancerMutationResult!
  createNetwork(input: CreateNetworkInput!, team: String): NetworkMutationResult!
  createProject(input: CreateProjectInput!, team: String): ProjectMutationResult!
  createSecret(input: CreateSecretInput!, team: String): SecretMutationResult!
  createVersion(input: CreateVersionInput!, team: String): CreateVersionResult!
  deleteSecret(id: String!, team: String): SecretMutationResult!
  destroyBastion(slug: String!, team: String): BastionMutationResult!
  failCliStep(error: String!, stepId: String!, team: String): FailCliStepResult!
  promoteBlueGreen(input: ActivationInput!, team: String): ActivationResult!
  promoteCanary(input: ActivationInput!, team: String): ActivationResult!
  promoteVersion(input: PromoteVersionInput!, team: String): PromoteVersionResult!
  rollbackDeployment(input: ActivationInput!, team: String): ActivationResult!

  """
  Give a password service user a new password. IN_PLACE changes it on the same user now, and running instances fail to connect until they restart. STAGED (plans with Advanced Deployments) creates the user in the binding's other slot, which the next deploy switches to, while the current user keeps working. Returns a deploymentId to poll.
  """
  rotateDatabaseServiceUser(
    """Database server id"""
    id: String!

    """
    Defaults to STAGED on plans with Advanced Deployments, IN_PLACE otherwise
    """
    mode: DatabaseUserRotationMode

    """Service user id from databaseServiceUsers"""
    serviceUserId: String!
    team: String
  ): DatabaseMutationResult!
  runConsoleCommand(command: [String!]!, environmentSlug: String!, projectId: String!, service: String!, team: String, variant: String = "default"): ConsoleRunResult!
  setCanary(input: ActivationInput!, team: String): ActivationResult!
  startDeployment(input: StartDeploymentInput!, team: String): StartDeploymentResult!
  startTeardown(input: StartTeardownInput!, team: String): StartTeardownResult!
  submitManifest(input: SubmitManifestInput!, team: String): SubmitManifestResult!
  triggerCertificateValidation(id: String!, team: String): CertificateMutationResult!
  triggerReroute(input: TriggerRerouteInput!, team: String): TriggerRerouteResult!

  """
  Change a database server. A setting change deploys the server right away and returns a deploymentId to poll.
  """
  updateDatabase(
    """Database server id"""
    id: String!
    input: UpdateDatabaseInput!
    team: String
  ): DatabaseMutationResult!
  updateSecret(input: UpdateSecretInput!, team: String): SecretMutationResult!
}

